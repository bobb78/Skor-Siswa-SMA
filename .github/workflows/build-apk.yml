name: Build & Sign Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # -------------------------------------------------------------
      # Build & Sign APK:
      # Evaluates secrets inside the runner environment (Bash),
      # which prevents the "Unrecognized named-value: 'secrets'" error.
      # -------------------------------------------------------------
      - name: Build APK (Release or Fallback to Debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 ditemukan. Men-decode keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/upload-keystore.jks"
            export KEYSTORE_PATH="${{ runner.temp }}/upload-keystore.jks"
            echo "Memulai kompilasi Release APK bertanda tangan (signed)..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Secret KEYSTORE_BASE64 belum dipasang. Mem-build Debug APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      # -------------------------------------------------------------
      # Hapus keystore sementara dari runner disk demi keamanan
      # -------------------------------------------------------------
      - name: Clean up Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/upload-keystore.jks"

      # -------------------------------------------------------------
      # Unggah hasil file APK ke Artifact Actions
      # -------------------------------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skor-Siswa-SMAN1Keritang-APK
          path: app/build/outputs/apk/**/*.apk

      # -------------------------------------------------------------
      # Buat Rilis Otomatis jika dipicu oleh Git Tag (contoh: v1.0.0)
      # -------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 Skor Siswa - SMA NEGERI 1 Keritang (${{ github.ref_name }})
            
            Aplikasi resmi sistem penghitungan skor kedisiplinan siswa SMA NEGERI 1 Keritang.
            
            ### 📥 Panduan Instalasi:
            1. Unduh berkas APK di bawah ini ke smartphone Android Anda.
            2. Buka file APK dan pilih **Instal** (Izinkan instalasi dari sumber ini / Unknown sources jika diminta).
            3. Aplikasi siap digunakan secara offline.
            
            **Akun Default:**
            - **Guru BK / Kesiswaan:** PIN `1234`
            - **Siswa / Wali Murid:** Masukkan NIS Siswa (contoh: `1001`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
